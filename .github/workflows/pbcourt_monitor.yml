name: Palm Beach Court Docket Monitor

# NOTE: scheduled cron is disabled — eCaseView's reCAPTCHA blocks Playwright
# from GitHub Actions IPs (and from any headless browser anywhere). The
# scheduled hourly check now runs on the user's Mac via a launchd agent —
# see scripts/install_launchd.sh and the "PB Court monitor" README section.
#
# This workflow remains as a manual-dispatch entry point for testing the
# email pipeline (mode=test) and inspecting state (mode=list). Don't expect
# mode=run to succeed from GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        type: choice
        options: [run, test, list]
        default: test

permissions:
  contents: write

concurrency:
  group: pbcourt-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run PB Court monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            test) python pbcourt_monitor.py --test ;;
            list) python pbcourt_monitor.py --list-state ;;
            run|"") python pbcourt_monitor.py ;;
            *) echo "Unknown mode: $MODE" >&2; exit 1 ;;
          esac

      - name: Commit updated state
        if: ${{ (github.event.inputs.mode || 'run') == 'run' }}
        run: |
          set -euo pipefail
          git config user.name "pbcourt-monitor-bot"
          git config user.email "pbcourt-monitor-bot@users.noreply.github.com"
          # Only stage PB-Court-owned state files — never touch FIFA/ATC state.
          git add state/pbcourt_dockets_seen.json state/pbcourt_failures.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No PB Court state changes to commit."
            exit 0
          fi
          git commit -m "chore(state): update pbcourt monitor state [skip ci]"
          # Rebase onto any FIFA / ATC commits that landed during our run,
          # then push. Retry a few times if the remote moved again mid-push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
